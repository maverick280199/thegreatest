<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:PF;src:url(fonts/playfair-display-latin-800-italic.woff2);font-style:italic;font-weight:800}
@font-face{font-family:PF;src:url(fonts/playfair-display-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:PP;src:url(fonts/poppins-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:PP;src:url(fonts/poppins-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:PP;src:url(fonts/poppins-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:TW;src:url(fonts/special-elite-latin-400-normal.woff2)}
@font-face{font-family:MK;src:url(fonts/permanent-marker-latin-400-normal.woff2)}
:root{--desk:#14171C;--paper:#F2E8D0;--paper2:#E6D7B4;--ink:#22201C;--red:#C8322A;--green:#2F7D4F;--hl:#FFE14D;--gold:#E8B84A;--thread:#D33A2C;--cream:#FFF6E2}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--desk);font-family:PP,sans-serif;color:var(--cream)}
#bg{position:absolute;inset:0}
#tab{position:absolute;top:84px;left:70px;display:flex;align-items:flex-end;gap:0}
#tab .f{background:#C9A56A;color:#3A2A12;font:24px TW;padding:14px 28px 10px;border-radius:14px 14px 0 0;letter-spacing:.06em}
#tab .n{font:22px TW;color:#C9A56A;margin-left:18px;padding-bottom:10px;letter-spacing:.08em;opacity:.85}
#rule{position:absolute;top:140px;left:70px;right:70px;height:3px;background:#C9A56A;opacity:.7}
#stage{position:absolute;top:175px;left:50px;right:50px;height:980px}
.sc{position:absolute;inset:0;opacity:0}
.c{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.doc{position:absolute;background:var(--paper);color:var(--ink);border-radius:6px;padding:46px 44px 40px;box-shadow:0 30px 50px rgba(0,0,0,.55),inset 0 0 60px rgba(160,120,60,.18);
  background-image:repeating-linear-gradient(transparent 0 46px,rgba(90,110,140,.18) 46px 48px)}
.doc .h{font:26px TW;letter-spacing:.14em;color:#6B5A3A;border-bottom:3px double #6B5A3A;padding-bottom:10px;margin-bottom:16px}
.doc .b{font:38px/1.5 TW;color:var(--ink)}
.doc .clip{position:absolute;top:-34px;left:60px;width:46px;height:110px;border:7px solid #9AA3AD;border-radius:24px;border-bottom:none}
.hl{background-image:linear-gradient(transparent 18%,var(--hl) 18% 88%,transparent 88%);background-repeat:no-repeat;background-size:0% 100%;padding:0 4px}
.hlr{background-image:linear-gradient(transparent 18%,rgba(211,58,44,.35) 18% 88%,transparent 88%)}
.stamp{position:absolute;font:800 64px PP;letter-spacing:.05em;padding:14px 34px;border:8px solid currentColor;border-radius:12px;color:var(--red);mix-blend-mode:multiply;
  -webkit-mask-image:radial-gradient(circle at 30% 40%,#000 60%,rgba(0,0,0,.75) 61%,#000 70%);white-space:nowrap}
.stamp.g{color:var(--green)}
.stamp.xl{font-size:92px}
.stamp.onDesk{mix-blend-mode:normal;background:rgba(20,23,28,.6)}
.pol{position:absolute;background:#FAFAF7;padding:20px 20px 70px;box-shadow:0 26px 44px rgba(0,0,0,.6)}
.pol .ph{width:380px;height:330px;background:#2B3A33;position:relative;overflow:hidden}
.pol .cap{position:absolute;bottom:14px;left:0;right:0;text-align:center;font:34px MK;color:#2A2A2A}
.note{position:absolute;background:var(--hl);color:#2A2A2A;font:38px/1.25 MK;padding:26px 30px;box-shadow:0 18px 30px rgba(0,0,0,.45);width:360px}
.big{font:800 128px/1 PF;font-style:italic;color:var(--gold);text-shadow:0 8px 30px rgba(0,0,0,.6)}
.kin{font:800 92px/1.08 PP;color:var(--cream);text-shadow:0 6px 24px rgba(0,0,0,.6)}
.kin em{font:800 100px PF;font-style:italic;color:var(--gold)}
.lab{font:26px TW;letter-spacing:.2em;color:#C9A56A}
.cnt{font:800 150px/1 PP;color:var(--cream)} .cnt small{font-size:60px;color:var(--gold)}
svg.ov{position:absolute;inset:0;overflow:visible;pointer-events:none}
#sub{position:absolute;top:1175px;left:60px;right:60px;text-align:center;font:800 56px/1.3 PP;color:#fff;text-shadow:0 4px 14px rgba(0,0,0,.8)}
#sub span{opacity:.35}#sub span.on{opacity:1}
#sub span.k{background-image:linear-gradient(transparent 55%,rgba(255,225,77,.85) 55% 92%,transparent 92%);color:#fff}
#glow{position:absolute;right:-120px;bottom:-140px;width:900px;height:900px;background:radial-gradient(circle,rgba(232,184,74,.28),transparent 62%)}
#full{position:absolute;right:0;bottom:-20px;width:560px;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 80px);transform-origin:70% 100%}
#bar{position:absolute;top:0;left:0;height:10px;background:var(--thread)}
</style></head><body>
<canvas id="bg" width="1080" height="1920"></canvas><div id="bar"></div>
<div id="tab"><div class="f">CASE FILE</div><div class="n">PUNDIR &amp; ASSOCIATES · LEGAL AWARENESS</div></div><div id="rule"></div>
<div id="stage"></div><div id="sub"></div>
<div id="glow"></div><img id="full">
<script>
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
const inr=n=>Math.round(n).toLocaleString('en-IN');
let S,T,A,els=[],stamps=[];
function bg(){const c=document.getElementById('bg'),x=c.getContext('2d');
 const g=x.createRadialGradient(260,300,50,540,900,1400);g.addColorStop(0,'#2A2E35');g.addColorStop(.5,'#181B21');g.addColorStop(1,'#0B0D10');x.fillStyle=g;x.fillRect(0,0,1080,1920);
 const im=x.getImageData(0,0,1080,1920),d=im.data;let s=11;const r=()=>(s=(s*16807)%2147483647)/2147483647;
 for(let i=0;i<d.length;i+=4){const n=(r()-.5)*16;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}x.putImageData(im,0,0);
 x.globalAlpha=.05;x.strokeStyle='#C9A56A';for(let i=0;i<40;i++){x.beginPath();const y=r()*1920;x.moveTo(0,y);x.bezierCurveTo(360,y+40*r(),720,y-40*r(),1080,y+20);x.stroke();}}
window.init=(s,t,a,dir)=>{S=s;T=t;A=a;bg();const f=document.getElementById('full');f.src='file://'+dir+'/full.png';
 const st=document.getElementById('stage');S.scenes.forEach(sc=>{const d=document.createElement('div');d.className='sc';d.innerHTML=sc.html;st.appendChild(d);els.push(d);});
 els.forEach(e=>{e.querySelectorAll('[data-fx="type"]').forEach(c=>c.dataset.full=c.textContent);
  e.querySelectorAll('[data-fx="draw"]').forEach(p=>{const L=p.getTotalLength();p.dataset.len=L;p.style.strokeDasharray=L;p.style.strokeDashoffset=L;});});
 window.ready=true;};
function sceneAt(t){let i=0;for(let k=0;k<T.scenes.length;k++)if(t>=T.scenes[k].start)i=k;return i;}
function delay(c,sc){return c.dataset.s!==undefined?T.sentences[+c.dataset.s].start-sc.start+(+c.dataset.d||0):(+c.dataset.in||0);}
window.renderAt=function(t){
 const i=sceneAt(t),sc=T.scenes[i],lt=t-sc.start;let shake=0;
 els.forEach((e,k)=>{if(k!==i){e.style.opacity=0;return;}e.style.opacity=ease(lt/0.25);
  e.querySelectorAll('[data-in],[data-s]').forEach(c=>{const d=delay(c,sc),fx=c.dataset.fx||'up',r=+c.dataset.r||0,q=lt-d;
   if(fx==='stamp'){const p=Math.min(1,Math.max(0,q/0.18));c.style.opacity=p;c.style.transform=`scale(${2.6-1.6*p}) rotate(${r||-9}deg)`;if(q>0&&q<0.35)shake=Math.max(shake,(1-q/0.35)*14);return;}
   if(fx==='pop'){const p=Math.min(1,Math.max(0,q/0.3));c.style.opacity=p;c.style.transform=`scale(${p<1?0.4+0.75*Math.sin(p*Math.PI/2):1}) rotate(${r}deg)`;return;}
   if(fx==='draw'){const p=ease(q/(+c.dataset.dur||0.9));c.style.strokeDashoffset=c.dataset.len*(1-p);c.style.opacity=q>0?1:0;return;}
   if(fx==='hl'){const p=ease(q/0.6);c.style.backgroundSize=`${p*100}% 100%`;return;}
   if(fx==='type'){const n=Math.floor(Math.max(0,q)*28);c.textContent=c.dataset.full.slice(0,n);c.style.opacity=q>0?1:0;return;}
   if(fx==='drop'){const p=ease(q/0.5);c.style.opacity=Math.min(1,q/0.15);c.style.transform=`translateY(${(1-p)*-500}px) rotate(${r+(1-p)*12}deg)`;return;}
   const p=ease(q/0.45);c.style.opacity=p;
   c.style.transform=fx==='left'?`translateX(${(1-p)*-420}px) rotate(${r}deg)`:fx==='right'?`translateX(${(1-p)*420}px) rotate(${r}deg)`:`translateY(${(1-p)*80}px) rotate(${r}deg)`;});
  e.querySelectorAll('[data-count]').forEach(c=>{const p=ease((lt-delay(c,sc)-0.1)/1.0);c.firstChild.textContent=inr(p*+c.dataset.count);});});
 document.getElementById('stage').style.transform=shake?`translate(${(Math.sin(t*90))*shake}px,${(Math.cos(t*70))*shake}px)`:'';
 const sen=T.sentences.find(x=>t>=x.start&&t<x.end+0.25),sub=document.getElementById('sub');
 if(sen){const all=sen.text.split(' '),N=all.length,p=(t-sen.start)/Math.max(.1,sen.end-sen.start),C=4,ci=Math.min(Math.ceil(N/C)-1,Math.floor(p*N/C));
  sub.innerHTML=all.slice(ci*C,ci*C+C).map((w,k)=>{const key=(S.keywords||[]).includes(w.toLowerCase().replace(/[^a-z0-9]/g,''))||/\d/.test(w);return `<span class="${(ci*C+k)/N<=p?'on':''}${key?' k':''}">${w}</span>`}).join(' ');}else sub.innerHTML='';
 const a=A.rms[Math.min(A.rms.length-1,Math.floor(t*A.fps))]||0;
 document.getElementById('full').style.transform=`translateY(${-a*6+Math.sin(t*2)*2}px) rotate(${Math.sin(t*1.2)*0.8}deg)`;
 document.getElementById('bar').style.width=(t/T.duration*1080)+'px';};
</script></body></html>
